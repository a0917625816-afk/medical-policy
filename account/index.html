<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>會員中心</title>
<link rel="stylesheet" href="/account/member.css">
</head>
<body class="acct">
<header class="top">
  <a class="logo" href="/"><span class="mark"><i></i><i></i><i></i></span><b id="brand">　</b></a>
  <a class="back" href="/">回到網站 →</a>
</header>

<main id="app" class="wrap">
  <p class="muted center" id="loading">載入中…</p>

  <!-- 站長第一次開通 -->
  <section id="v-setup" class="card narrow" hidden>
    <h1>建立站長帳號</h1>
    <p class="muted">第一次使用：輸入開通碼，建立你自己的站長帳號。開通碼只能用一次。</p>
    <form id="f-setup">
      <label>開通碼<input name="code" autocomplete="off" required></label>
      <label>姓名<input name="name" required value="華群"></label>
      <label>帳號（手機號碼或 Email）<input name="login" inputmode="email" autocomplete="username" required></label>
      <label>密碼（至少 8 個字）<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="btn gold">建立站長帳號</button>
      <p class="err" data-err></p>
    </form>
  </section>

  <!-- 登入／註冊 -->
  <section id="v-auth" class="card narrow" hidden>
    <div class="tabs">
      <button data-tab="login" class="on">登入</button>
      <button data-tab="signup">註冊</button>
    </div>
    <form id="f-login" data-pane="login">
      <label>帳號（手機號碼或 Email）<input name="login" inputmode="email" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn gold">登入</button>
      <p class="hint">登入一次，這台裝置 90 天內不用再登入。每個帳號最多 3 台裝置。</p>
      <p class="hint">忘記密碼請聯絡站長重設。</p>
      <p class="err" data-err></p>
    </form>
    <form id="f-signup" data-pane="signup" hidden>
      <label>姓名<input name="name" autocomplete="name" required></label>
      <label>帳號（手機號碼或 Email）<input name="login" inputmode="email" autocomplete="username" required></label>
      <label>密碼（至少 8 個字）<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>邀請碼（選填）<input name="code" autocomplete="off" placeholder="夥伴或推廣邀請碼"></label>
      <button class="btn gold">註冊</button>
      <p class="err" data-err></p>
    </form>
  </section>

  <!-- 會員頁 -->
  <section id="v-me" hidden>
    <div class="card hello">
      <div>
        <p class="muted">歡迎回來</p>
        <h1 id="me-name"></h1>
        <p class="muted" id="me-login"></p>
      </div>
      <div class="state" id="me-state"></div>
    </div>

    <div class="card" id="must-change" hidden>
      <h2>請先設定你自己的密碼</h2>
      <p class="muted">你目前用的是站長給的臨時密碼。</p>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>方案</h2>
        <div id="plans" class="plans"></div>
        <p class="hint" id="pay-note">線上刷卡即將開放；目前請聯絡站長辦理。</p>
      </div>
      <div class="card">
        <h2>已登入的裝置 <small class="muted" id="dev-count"></small></h2>
        <ul id="devices" class="list"></ul>
        <p class="hint">超過 3 台時，最久沒用的那台會自動登出。</p>
      </div>
    </div>

    <div class="grid2">
      <div class="card" id="pw-card">
        <h2>修改密碼</h2>
        <form id="f-pw">
          <label>目前密碼<input name="old" type="password" autocomplete="current-password" required></label>
          <label>新密碼（至少 8 個字）<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
          <button class="btn">修改密碼</button>
          <p class="err" data-err></p>
        </form>
      </div>
      <div class="card">
        <h2>付款紀錄</h2>
        <ul id="pays" class="list"></ul>
      </div>
    </div>

    <div class="actions">
      <a class="btn gold" href="/">回到網站</a>
      <a class="btn dark" href="/admin/" id="to-admin" hidden>進入站長後台</a>
      <button class="btn ghost" id="logout">登出這台裝置</button>
    </div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/account/member.js"></script>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const q = new URLSearchParams(location.search);
  const next = q.get('next') && q.get('next').startsWith('/') && !q.get('next').startsWith('//') ? q.get('next') : '';
  const cfg = await M.api('/api/config').catch(() => null);
  $('#loading').hidden = true;
  if (!cfg) { $('#loading').hidden = false; $('#loading').textContent = '會員系統暫時無法使用，請稍後再試。'; return; }
  M.brand(cfg.brand);
  const show = (id) => ['#v-setup', '#v-auth', '#v-me'].forEach((s) => ($(s).hidden = s !== id));

  async function loadMe() {
    let d; try { d = await M.api('/api/me'); } catch (e) { return false; }
    const u = d.user;
    show('#v-me');
    $('#me-name').textContent = u.name || '會員';
    $('#me-login').textContent = u.login;
    const st = { admin: ['站長', 'gold'], partner: ['夥伴（免費使用）', 'green'], paid: ['付費會員', 'green'], unpaid: ['尚未付費', 'gray'], expired: ['已到期', 'red'], disabled: ['已停用', 'red'] }[u.state];
    $('#me-state').innerHTML = `<span class="badge ${st[1]}">${st[0]}</span>` + (u.state === 'paid' || u.state === 'expired' ? `<p class="muted">到期日 ${M.esc(u.paid_until)}</p>` : '');
    $('#must-change').hidden = !u.must_change;
    if (u.must_change) $('#pw-card').classList.add('focus');
    $('#to-admin').hidden = u.role !== 'admin';
    const P = d.prices;
    $('#plans').innerHTML = u.role === 'partner' || u.role === 'admin'
      ? `<p class="free">${u.role === 'admin' ? '站長帳號' : '你是夥伴，全部功能免費使用'}</p>`
      : [['month', '月繳', P.month, '/ 月', ''], ['year', '年繳', P.year, '/ 年', `等於每月 ${Math.round(P.year / 12)} 元`], ['team', '處經理團購', P.team, '/ 人 / 年', '5 人以上 9 折・10 人 85 折・20 人 8 折']]
          .map(([k, n, p, unit, sub]) => `<div class="plan ${u.plan === k ? 'cur' : ''}"><b>${n}</b><span class="price">NT$${p.toLocaleString()}</span><small>${unit}</small><em>${sub}</em></div>`).join('');
    $('#pay-note').hidden = u.role === 'partner' || u.role === 'admin';
    $('#dev-count').textContent = `${d.devices.length} / ${d.max_devices}`;
    $('#devices').innerHTML = d.devices.map((v) => `<li><span><b>${M.esc(v.device)}</b>${v.current ? ' <span class="badge green sm">這台</span>' : ''}<br><small class="muted">最後使用 ${M.when(v.last_seen)}</small></span>${v.current ? '' : `<button class="btn sm ghost" data-rev="${M.esc(v.id)}">登出</button>`}</li>`).join('');
    $('#pays').innerHTML = d.payments.length ? d.payments.map((p) => `<li><span>${M.esc(p.period_from)} ～ ${M.esc(p.period_to)}<br><small class="muted">${M.planName(p.plan)}${p.refunded ? '（已退款）' : ''}</small></span><b>NT$${p.amount.toLocaleString()}</b></li>`).join('') : '<li class="muted">還沒有付款紀錄</li>';
    return u;
  }

  $('#devices').addEventListener('click', async (e) => {
    const id = e.target.dataset.rev; if (!id) return;
    await M.api('/api/me/devices/revoke', { id }).catch(M.alert); M.toast('已登出那台裝置'); loadMe();
  });
  $('#logout').onclick = async () => { await M.api('/api/logout', {}); location.reload(); };
  M.form('#f-pw', async (v) => { await M.api('/api/me/password', v); M.toast('密碼已更新，其他裝置已登出'); $('#f-pw').reset(); $('#pw-card').classList.remove('focus'); loadMe(); });

  const done = async (r) => {
    if (r.kicked) M.toast('已超過 3 台裝置，最久沒用的那台已自動登出');
    if (next && !r.user.must_change) { location.href = next; return; }
    loadMe();
  };
  M.form('#f-login', async (v) => done(await M.api('/api/login', v)));
  M.form('#f-signup', async (v) => done(await M.api('/api/signup', v)));
  M.form('#f-setup', async (v) => { await M.api('/api/setup', v); location.href = '/admin/'; });

  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('[data-pane]').forEach((p) => (p.hidden = p.dataset.pane !== b.dataset.tab));
  }));
  if (q.get('code')) { $('#f-signup [name=code]').value = q.get('code'); document.querySelector('[data-tab=signup]').click(); }

  const u0 = await loadMe();
  if (u0) { if (next && next !== '/account/' && !u0.must_change) location.href = next; return; }
  show(cfg.needs_setup ? '#v-setup' : '#v-auth');
})();
</script>
</body>
</html>
